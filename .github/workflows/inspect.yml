# ВРЕМЕННЫЙ рабочий инструмент разведки: печатает выдержки из больших
# файлов в комментарий PR. УДАЛИТЬ после вшивания маршрутов карточки.
name: inspect

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Выдержки
        run: |
          M=src/api/main.py
          S=src/collector/stream.py
          {
            echo '## stream.py 240,325 — что кладётся в book и что отдаёт snapshot'
            sed -n '240,325p' "$S"
            echo
            echo '## main.py 620,700 — остаток /api/book-live'
            sed -n '620,700p' "$M"
          } > body.txt 2>&1
          {
            echo '### разведка 5: snapshot и book-live'
            echo '```python'
            head -c 50000 body.txt
            echo '```'
          } > comment.md

      - name: Отчёт в PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
