name: inspect

# ВРЕМЕННОЕ задание. Удалить после подключения карточки.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Выдержки
        run: |
          S=src/collector/stream.py
          {
            echo '## stream.py 175,205 — сборка минутного бара'
            sed -n '175,205p' "$S"
            echo
            echo '## stream.py 765,800 — что кладётся в minutes'
            sed -n '765,800p' "$S"
            echo
            echo '## stream.py 355,400 — объявление состояния'
            sed -n '355,400p' "$S"
            echo
            echo '## card.py — какие ключи бара ждёт карточка'
            grep -n 'def _series' -A 14 src/analysis/card.py
          } > body.txt
          cat body.txt

      - name: Отчёт в PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### разведка 3: ключи минутной записи'
            echo '```python'
            tail -c 40000 body.txt
            echo '```'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
