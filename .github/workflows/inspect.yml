# ВРЕМЕННЫЙ рабочий инструмент разведки: печатает выдержки из больших
# файлов в комментарий PR. src/api/main.py — 167 КБ, его нельзя ни читать
# целиком, ни перепечатывать, а угадывать имена состояния запрещено.
# УДАЛИТЬ после того, как маршруты карточки будут вшиты и проверены.
name: inspect

on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Выдержки
        run: |
          M=src/api/main.py
          S=src/collector/stream.py
          {
            echo '## где в main.py вообще берётся стакан'
            grep -n 'bids\|asks\|orderbook\|book_live\|get_orderbook' "$M" | head -40
            echo
            echo '## main.py 563,620 — /api/book-live'
            sed -n '563,620p' "$M"
            echo
            echo '## main.py 857,907 — /api/micro'
            sed -n '857,907p' "$M"
            echo
            echo '## stream.py — где хранится стакан в памяти'
            grep -n 'def book\|self.book\|bids\|asks\|def snapshot' "$S" | head -40
            echo
            echo '## book_ticks.py — что отдаёт TickRing'
            grep -n 'def \|BEST\|bid\|ask' src/analysis/book_ticks.py | head -40
          } > body.txt 2>&1
          {
            echo '### разведка 4: стакан и оборот'
            echo '```python'
            head -c 50000 body.txt
            echo '```'
          } > comment.md

      - name: Отчёт в PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
