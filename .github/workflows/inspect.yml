name: inspect

# ВРЕМЕННОЕ задание. Удалить после подключения карточки.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Выдержки
        run: |
          F=src/api/main.py
          S=src/collector/stream.py
          {
            echo '## main.py 460-500 — свечи из потока'
            sed -n '460,500p' "$F"
            echo
            echo '## main.py 973,1045 — сканер объёма'
            sed -n '973,1045p' "$F"
            echo
            echo '## main.py 1112,1150 — live по тикеру'
            sed -n '1112,1150p' "$F"
            echo
            echo '## main.py 580,600 — начало сводки'
            sed -n '580,600p' "$F"
            echo
            echo '## stream.py — где рождаются minutes/lots/steps/atr'
            grep -n 'minutes\|self.lots\|self.steps\|self.atr\|self.tape\|self.levels\|self.ticks\|def bars\|open\b' "$S" | head -60
          } > body.txt
          cat body.txt

      - name: Отчёт в PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### разведка 2: формат баров и соседние маршруты'
            echo '```python'
            tail -c 55000 body.txt
            echo '```'
          } > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
