name: patch-apply

#  ОБЩИЙ применитель патчей вместо отдельного workflow на каждый патч.
#
#  Отчёт КОММИТИТСЯ файлом, а не публикуется комментарием. Комментарий через
#  `gh pr comment ... || true` два раза отрапортовал зелёным шагом и не опубликовал
#  ничего: отчёт, который может молча пропасть, не является отчётом.

on:
  push:
    branches: [main]
    paths: ['scripts/_patch_*.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Патч
        id: patch
        continue-on-error: true
        run: |
          set +e
          : > patch.txt
          shopt -s nullglob
          for f in scripts/_patch_*.py; do
            echo "== $f" >> patch.txt
            python "$f" >> patch.txt 2>&1
          done
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat patch.txt
        shell: bash

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx==0.27.0

      - name: pytest
        id: run
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q -rA \
            tests/test_volume_events.py \
            tests/test_profile_note.py \
            tests/test_floor_reason.py \
            tests/test_api_profile_note.py > out.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat out.txt

      - name: Отчёт файлом
        if: always()
        run: |
          mkdir -p docs
          {
            echo '# Отчёт patch-apply'
            echo
            echo "дата: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "коммит: $GITHUB_SHA"
            echo "запуск: $GITHUB_RUN_ID"
            echo "код патча: ${{ steps.patch.outputs.code }}"
            echo "код pytest: ${{ steps.run.outputs.code }}"
            echo
            echo '## патч'
            echo '```'
            cat patch.txt
            echo '```'
            echo
            echo '## pytest, последние 12000 символов'
            echo '```'
            tail -c 12000 out.txt
            echo '```'
          } > docs/patch-apply-report.md
          git config user.name modex-bot
          git config user.email bot@modex.local
          git add docs/patch-apply-report.md
          if [ "${{ steps.run.outputs.code }}" = "0" ]; then
            git add src/analysis/volume_events.py src/api/main.py
            git add -A scripts
          fi
          git commit -m "patch-apply: отчёт, и патч если тесты зелёные" || echo "нечего коммитить"
          git push || echo "push не прошёл"

      - name: Итог
        run: test "${{ steps.run.outputs.code }}" = "0" || exit 1
