name: patch-note

# ОТЧЁТ КОММИТИТСЯ ФАЙЛОМ, а не комментарием в PR. Версия 2 публиковала его
# через `gh pr comment ... || true`: шаг был зелёным, комментарий не появился
# ни разу, и падение теста осталось невидимым. Права contents: write в этом
# репозитории проверены множеством прошлых патчей, поэтому отчёт кладётся в
# docs/patch-note-report.md — его видно и без доступа к логам сборки.

on:
  push:
    branches: [main]
    paths: ['scripts/_patch_note.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Патч
        id: patch
        continue-on-error: true
        run: |
          set +e
          python scripts/_patch_note.py > patch.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat patch.txt

      - name: Зависимости
        run: pip install pytest httpx==0.27.0

      - name: pytest
        id: run
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q tests/test_volume_events.py tests/test_profile_note.py tests/test_figi_failure_reason.py > out.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -c 20000 out.txt

      - name: Отчёт файлом
        if: always()
        run: |
          set +e
          mkdir -p docs
          {
            echo "# Отчёт patch-note"
            echo
            echo "дата: $(date -u +%FT%TZ)"
            echo "коммит: $GITHUB_SHA"
            echo "запуск: $GITHUB_RUN_ID"
            echo "код патча: ${{ steps.patch.outputs.code }}"
            echo "код pytest: ${{ steps.run.outputs.code }}"
            echo
            echo '## патч'
            echo '```'
            cat patch.txt 2>/dev/null || echo 'patch.txt не создан'
            echo '```'
            echo
            echo '## pytest, последние 12000 символов'
            echo '```'
            tail -c 12000 out.txt 2>/dev/null || echo 'out.txt не создан'
            echo '```'
          } > docs/patch-note-report.md
          git config user.name "modex-bot"
          git config user.email "bot@modex.local"
          git add docs/patch-note-report.md
          if [ "${{ steps.run.outputs.code }}" = "0" ]; then
            git add src/analysis/volume_events.py main.py
            git add -A scripts
          fi
          git commit -m "patch-note: отчёт, и патч если тесты зелёные" || echo "нечего коммитить"
          git push || echo "push не прошёл"

      - name: Итог
        run: |
          test "${{ steps.run.outputs.code }}" = "0" || exit 1
