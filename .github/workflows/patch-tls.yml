# Применение патч-скрипта и прогон тестов.
#
# Зачем workflow для правки кода: у агента нет инструмента построчной правки
# файлов, только запись файла целиком. Для tinkoff_client.py на 25 КБ это
# неприемлемо — перепечатывание уже один раз обрывалось на середине. Поэтому
# правка описывается точными заменами в скрипте, а применяет их CI, где есть
# и файл, и git.
#
# paths ограничивает запуск самим скриптом: скрипт удаляет себя, значит
# повторных запусков не будет. Пуши бота не поднимают workflow (так устроен
# secrets.GITHUB_TOKEN), поэтому цикла тоже не возникает.
name: patch-tls

on:
  push:
    branches: [main]
    paths:
      - 'scripts/_patch_tls_verdict.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Патч НЕ валит job при неудачном якоре сразу: сначала нужно увидеть
      # отчёт и результат тестов, иначе разбираться будет нечем.
      - name: Патч
        id: patch
        run: |
          set +e
          python scripts/_patch_tls_verdict.py | tee patch.log
          echo "code=$?" >> $GITHUB_OUTPUT
          cat patch.log >> $GITHUB_STEP_SUMMARY

      # Только pytest и httpx: полная установка requirements.txt тянет torch и
      # в первой версии этого CI падала на pip install через 68 секунд.
      - name: Зависимости
        run: pip install pytest httpx==0.27.0

      - name: pytest
        id: run
        run: |
          set +e
          python -m pytest -q -rA \
            tests/test_token_and_board.py \
            tests/test_figi_failure_reason.py \
            tests/test_volume_events.py > out.txt 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
          echo '### pytest' >> $GITHUB_STEP_SUMMARY
          tail -c 50000 out.txt >> $GITHUB_STEP_SUMMARY

      # Коммитим ТОЛЬКО ожидаемые пути. git add -A однажды затащил в репозиторий
      # временный patch.txt — второй раз этой ошибки не будет.
      - name: Коммит
        if: always()
        run: |
          rm -f out.txt patch.log
          git config user.name "modex-bot"
          git config user.email "bot@modex.local"
          git add src/collector/tinkoff_client.py tests/test_token_and_board.py
          git add -u scripts/_patch_tls_verdict.py
          git commit -m "Вердикт TLS отделён от вердикта «сеть» (применено патч-скриптом)" \
            || echo "нечего коммитить"
          git push

      - name: Итог
        run: |
          test "${{ steps.patch.outputs.code }}" = "0" || exit 1
          exit ${{ steps.run.outputs.code }}
