name: patch-token-board

# Одноразовый воркфлоу: применяет патч, коммитит, прогоняет тесты и отчитывается
# комментарием в PR. Логи Actions агенту недоступны, поэтому результат должен
# выйти туда, где его видно без логов. Скрипт удаляет себя и этот файл.
on:
  push:
    branches: [claude/tinkoff-token-figi-3b1009988e53808982bc00a9b24f23e7]

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: применить патч
        id: patch
        run: |
          set +e
          python scripts/_patch_token_board.py > patch.txt 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
          cat patch.txt

      - name: закоммитить
        if: steps.patch.outputs.code == '0'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Правки ревью: общий clean_token для REST и gRPC, борд TQ* выше apiTradeAvailableFlag"
            git push
          else
            echo "изменений нет — коммитить нечего"
          fi

      - name: зависимости
        run: pip install pytest httpx==0.27.0

      - name: тесты
        id: run
        run: |
          set +e
          python -m pytest -q -rA tests/test_volume_events.py tests/test_figi_failure_reason.py tests/test_token_and_board.py > out.txt 2>&1
          echo "code=$?" >> $GITHUB_OUTPUT
          cat out.txt

      - name: отчёт в PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f patch.txt ] || echo "патч не запускался" > patch.txt
          [ -f out.txt ] || echo "тесты не запускались" > out.txt
          {
            echo '### патч правок ревью'
            echo '```'
            tail -c 4000 patch.txt
            echo '```'
            echo '### тесты'
            echo '```'
            tail -c 50000 out.txt
            echo '```'
          } > body.md
          cat body.md >> $GITHUB_STEP_SUMMARY
          gh pr comment 2 --body-file body.md

      - name: итог
        run: |
          test "${{ steps.patch.outputs.code }}" = "0" || exit 1
          exit ${{ steps.run.outputs.code }}
