name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # torch ДО requirements.txt и жёстко с CPU-индекса: иначе pip сливает
      # индексы и тянет сборку с пакетами nvidia-* (свыше 3 ГБ).
      - name: torch (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.4.1

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest -q --maxfail=0
