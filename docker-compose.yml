version: "3.9"

services:
  moodex:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_PHONE=${TELEGRAM_PHONE}
      - TELEGRAM_STRING_SESSION=${TELEGRAM_STRING_SESSION}
      - NLP_MODEL=${NLP_MODEL:-cointegrated/rubert-tiny-sentiment-balanced}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_SECRET_KEY=${API_SECRET_KEY}
      # ВАЖНО: БД лежит в ./data, который смонтирован на постоянный том
      # moodex_data. Иначе при пересборке образа сигналы/журнал терялись бы.
      - DATABASE_URL=sqlite+aiosqlite:///./data/moodex.db
      - SENTIMENT_WINDOW_MINUTES=${SENTIMENT_WINDOW_MINUTES:-60}
      - MIN_MESSAGES_FOR_SIGNAL=${MIN_MESSAGES_FOR_SIGNAL:-5}
    volumes:
      - moodex_data:/app/data
    restart: unless-stopped
    healthcheck:
      # curl теперь ставится в Dockerfile. Раньше его в образе не было, и эта
      # проверка падала не потому, что сервис мёртв, а потому что нет бинарника.
      # Для оркестратора разницы никакой: контейнер не становится healthy,
      # деплой признаётся неудачным, продолжает работать ПРЕЖНИЙ образ — ровно
      # та картина, что наблюдалась 30–31.07: контейнер перезапускается, но код
      # в нём старый.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/stats"]
      interval: 30s
      timeout: 10s
      # Без start_period отсчёт retries идёт с первой секунды, а холодный старт
      # не мгновенный: импорт всей цепочки модулей и setup_db. 30s x 3 — это
      # полторы минуты, и контейнер объявляется больным раньше, чем прогрелся.
      start_period: 120s
      retries: 3

volumes:
  moodex_data:
